<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Convert</title>
</head>
<body>
    <h1>Upload Image to Convert</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Convert to JPEG</button>
    </form>
</body>
</html>
